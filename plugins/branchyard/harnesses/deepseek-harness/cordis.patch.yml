# Branchyard's hooks for DeepSeek Harness: the Claude Code hook bridge runs
# ~/.dsh/branchyard-hooks.json (a copy of harnesses/deepseek-harness/hooks.json),
# whose commands call `by hook --harness deepseek-harness`. Merge this insert
# into $DSH_HOME/cordis.patch.yml (every profile) or a profile's own patch
# file; `by init plugin` does that. See docs/harness-hooks.md.
- insert:
    - id: branchyard-hooks
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: !!js >-
          process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.dsh', 'branchyard-hooks.json')
