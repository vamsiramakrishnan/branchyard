# Claude Code without the marketplace plugin: the two skills and the
# commands into your user directory, the plugin's two hooks merged into
# ~/.claude/settings.json (the same commands as hooks/hooks.json), and the
# status line, merged only when you have none (a plugin cannot set one).
harness = "claude-code"
binaries = ["claude"]
provides = ["hooks", "commands", "skills", "statusline"]

[[file]]
from = "skills/setup"
to = "~/.claude/skills/setup"
how = "write"

[[file]]
from = "skills/delegate"
to = "~/.claude/skills/delegate"
how = "write"

[[file]]
from = "commands"
to = "~/.claude/commands/branchyard"
how = "write"

[[file]]
from = "harnesses/claude-code/settings-hooks.json"
to = "~/.claude/settings.json"
how = "merge-json"
at = ""

# A status line you already have is yours: left as it is, with the line to
# choose in the plan's notes, instead of the whole install being refused.
[[file]]
from = "harnesses/claude-code/settings-statusline.json"
to = "~/.claude/settings.json"
how = "merge-json"
at = ""
unless_set = "statusLine"

[[note]]
text = "If the Branchyard plugin is also installed from the marketplace (/plugin install branchyard@branchyard), its hooks run too: keep one of the two."

[[note]]
text = "Restart Claude Code; /hooks lists the two Branchyard hooks."
