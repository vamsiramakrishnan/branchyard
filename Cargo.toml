[workspace]
members = ["crates/branchyard-controls", "crates/branchyard-protocol", "crates/branchyard-sdk", "crates/branchyard-cli"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["uuid1"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
