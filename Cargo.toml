[workspace]
members = [
    "crates/branchyard",
    "crates/branchyard-bridge",
    "crates/branchyard-cli",
    "crates/branchyard-client",
    "crates/branchyard-controls",
    "crates/branchyard-harness",
    "crates/branchyard-herdr",
    "crates/branchyard-microsandbox",
    "crates/branchyard-mcp",
    "crates/branchyard-provision",
    "crates/branchyard-qualify",
    "crates/branchyard-recipe",
    "crates/branchyard-runtime",
    "crates/branchyard-sandbox",
    "crates/branchyard-server",
    "crates/branchyard-setup",
    "crates/branchyard-substrate",
    "crates/branchyard-support",
    "crates/branchyard-sync",
    "crates/branchyard-testkit",
    "crates/branchyard-wire",
    "crates/branchyard-workspace",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.94"

# Every dependency used by more than one member is declared here once; members
# say `workspace = true` and add only their own features. tools/check_workspace_deps.py
# keeps it that way.
[workspace.dependencies]
backon = { version = "1.6", default-features = false, features = ["std"] }
base64 = "0.22"
blake3 = "1"
clap = { version = "4.6", features = ["derive"] }
glob = "0.3"
hex = "0.4.3"
httparse = "1"
jiff = { version = "0.2.37", default-features = false }
percent-encoding = "2"
postgres = "0.19"
prost = "0.14"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
ring = "0.17"
rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1"
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
shlex = "2"
tempfile = "3.27.0"
tokio = { version = "1.52", default-features = false }
toml = "1.1.6"
toml_edit = { version = "0.25.15", default-features = false, features = ["parse"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1.26.1", features = ["v4"] }
webpki-roots = "1"

# Error discipline, enforced by Clippy at deny. Existing violations carry a
# targeted `#[allow(..)]` with a `// ratchet:` marker; tools/check_lint_ratchet.py
# lets the per-crate marker count fall but never rise. See CONTRIBUTING.md,
# "Lints and the ratchet".
[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
let_underscore_must_use = "deny"
let_underscore_future = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unwrap_in_result = "deny"
map_unwrap_or = "deny"
too_many_arguments = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
