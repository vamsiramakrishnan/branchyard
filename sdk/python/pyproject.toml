# The Python SDK as an installable distribution: `pip install ./sdk/python`,
# or the same from the extracted `branchyard-sdk-<version>.zip`. Two
# top-level modules, standard library only. The version is the workspace's
# (`Cargo.toml`) in PEP 440's spelling; tools/release_version.py checks it.
# Not published to PyPI yet: install from a checkout or the release's wheel.
# The license is an SPDX expression, which setuptools reads from 77 on (the
# table form it replaces stops building in 2027). See README.md here and
# docs/sdk.md#install.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "branchyard"
version = "0.2.1"
description = "Run and coordinate agent tasks from Python, with optional tools for documents, data and evidence."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
keywords = ["branchyard", "coding agents", "git", "harness", "sdk"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
artifacts = [
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "pypdf==6.6.0",
    "reportlab==4.4.10",
    "Pillow==11.3.0",
    "jsonschema==4.25.1",
    "pdfplumber==0.11.9; python_version >= '3.10'",
    "pandas==2.3.3",
    "Pint==0.24.4",
]

[project.scripts]
branchyard-artifacts = "branchyard_artifacts.__main__:main"

[project.urls]
Homepage = "https://github.com/vamsiramakrishnan/branchyard"
Documentation = "https://github.com/vamsiramakrishnan/branchyard/blob/main/docs/sdk.md"
Source = "https://github.com/vamsiramakrishnan/branchyard/tree/main/sdk/python"
Issues = "https://github.com/vamsiramakrishnan/branchyard/issues"

[tool.setuptools]
py-modules = ["branchyard", "branchyard_client"]
packages = ["branchyard_artifacts"]

[tool.setuptools.package-data]
branchyard_artifacts = ["schemas/*.json", "examples/*.json"]
