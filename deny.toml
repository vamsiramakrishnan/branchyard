# cargo-deny policy: the supply-chain gate (.github/workflows/check.yml, job
# `deny`). Run it with `cargo deny --locked check` (see CONTRIBUTING.md).

[graph]
# Check every feature, so an optional dependency (Microsandbox, PostgreSQL)
# cannot bring in a license or advisory that the default build does not.
all-features = true

[advisories]
# Known vulnerabilities, unmaintained crates and yanked releases fail the job.
# An advisory that does not apply goes in `ignore` with the reason, never
# without one.
version = 2
yanked = "deny"
ignore = []

[licenses]
# The licenses present in Cargo.lock today. A new license is a decision:
# add it here in the same change, with the reason in the commit message.
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots: the Mozilla CA bundle
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate double compile time and binary size and are how
# a patched version and a vulnerable one end up side by side. Warn so the
# list stays visible; it is not a failure because most come from upstream.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # first-party path dependencies carry no version

[sources]
# Cargo.lock resolves from crates.io only: no git dependencies, no other
# registries. (vendor/ is reference source, not a Cargo dependency.)
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
