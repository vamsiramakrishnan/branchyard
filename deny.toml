# cargo-deny policy: the supply-chain gate (.github/workflows/check.yml, job
# `deny`). Run it with `cargo deny --locked check` (see CONTRIBUTING.md).

[graph]
# Check every feature, so an optional dependency (Microsandbox, PostgreSQL)
# cannot bring in a license or advisory that the default build does not.
all-features = true

[advisories]
# Known vulnerabilities, unmaintained crates and yanked releases fail the job.
# An advisory that does not apply goes in `ignore` with the reason, never
# without one.
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 2.0.1 only via microsandbox-filesystem (optional microsandbox feature); upstream has no fix" },
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar 0.6.4 (unmaintained, no vulnerability) only via microsandbox-image 0.7.3 (optional microsandbox feature); no maintained release of microsandbox moves off it yet" },
    { id = "RUSTSEC-2026-0459", reason = "mitigated, not inapplicable: SQLite before 3.54.0 (bundled in libsqlite3-sys 0.37.0, through rusqlite 0.39) can return uninitialized memory when a database is opened beside a -wal file whose page size differs. Not fixable by upgrading: rusqlite 0.41 needs libsqlite3-sys >=0.39, while sqlx-sqlite 0.9.0, brought in by the optional microsandbox dependency (microsandbox =0.7.3 -> microsandbox-db -> sqlx), requires <0.38 and links = sqlite3 allows one copy. Instead Branchyard reads both page sizes and refuses a mismatched pair before SQLite opens it, in branchyard_support::check_wal_pair (crates/branchyard-support/src/sqlite_pair.rs), called before every database open of Branchyard's own. It resolves the path itself, with the system, into a plain name (no dot elements, no links), and every open gives SQLite that name, so the file checked is the file opened. It also refuses a path it cannot resolve to one file and a file it cannot judge; docs/durability.md lists the cases. Whoever can change the files, or a directory above them, between the check and the open is not stopped, and the microsandbox SDK's own database is not covered. Remove this entry when sqlx-sqlite allows libsqlite3-sys >=0.39: raise rusqlite to 0.41 or later." },
]

[licenses]
# The licenses present in Cargo.lock today. A new license is a decision:
# add it here in the same change, with the reason in the commit message.
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots: the Mozilla CA bundle
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate double compile time and binary size and are how
# a patched version and a vulnerable one end up side by side. Warn so the
# list stays visible; it is not a failure because most come from upstream.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # first-party path dependencies carry no version

[sources]
# Cargo.lock resolves from crates.io only: no git dependencies, no other
# registries. (vendor/ is reference source, not a Cargo dependency.)
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
