[package]
name = "branchyard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The by command: delegate coding work to agent harnesses on git branches"

[[bin]]
name = "by"
path = "src/main.rs"

[dependencies]
branchyard = { path = "../branchyard" }
serde_json = "1"

[dev-dependencies]
# Only to construct events in tests: `branchyard` does not re-export
# `NativeSession` or `PermissionKey`.
branchyard-harness = { path = "../branchyard-harness" }
