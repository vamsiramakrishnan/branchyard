[package]
name = "branchyard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "The by command: delegate coding work to agent harnesses on git branches"

[lints]
workspace = true

[[bin]]
name = "by"
path = "src/main.rs"

[features]
# Accept --provider microsandbox. Needs libcap-ng-dev to link; see
# docs/providers.md.
microsandbox = ["branchyard/microsandbox"]
# `by serve --database postgres://...`; see docs/server.md.
postgres = ["branchyard-server/postgres"]
# Derive schemars::JsonSchema on the rig spec's types and check that
# schema/rig.json is what they generate; see docs/rigs.md.
schema = ["dep:schemars"]

[dependencies]
branchyard-support = { path = "../branchyard-support" }
branchyard = { path = "../branchyard" }
branchyard-client = { path = "../branchyard-client" }
branchyard-wire = { path = "../branchyard-wire" }
branchyard-server = { path = "../branchyard-server" }
branchyard-workspace = { path = "../branchyard-workspace" }
branchyard-mcp = { path = "../branchyard-mcp" }
serde = { workspace = true }
serde_json = { workspace = true }
# `by rig` spec files: parsed, then deserialized with its serde support
# (which keeps each value's span, so errors cite line and column).
toml_edit = { workspace = true, features = ["serde"] }
# The command line; `env` reads BRANCHYARD_REMOTE and the other globals.
clap = { workspace = true, features = ["env"] }
# `by completions` and `by man`.
clap_complete = "4.6"
clap_mangen = "0.3.3"
# `--check` and `--command` splitting. Already in Cargo.lock.
shlex = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
hex = { workspace = true }
# `by init`'s interactive wizard, and the setup engine it drives.
cliclack = "0.5.6"
branchyard-setup = { version = "0.0.1", path = "../branchyard-setup" }
dirs = "7"
branchyard-harness = { version = "0.0.1", path = "../branchyard-harness" }
# `by harnesses --all` and `by connectors catalog`: the generated catalogs.
branchyard-controls = { path = "../branchyard-controls" }
schemars = { workspace = true, optional = true }
# `by watch`'s dashboard. On crossterm 0.29, already in Cargo.lock; ratatui
# 0.30 needs Rust 1.88.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
unicode-width = "0.2.2"
# `by --remote ssh://`: names each remote's private directories. Already in
# Cargo.lock.
sha2 = { workspace = true }
# `by recipe`: environment recipes and their sandbox provider.
branchyard-recipe = { path = "../branchyard-recipe" }
branchyard-sandbox = { path = "../branchyard-sandbox" }
# `by sync`: tasks replicated to durable storage (docs/sync.md).
branchyard-sync = { path = "../branchyard-sync" }

[dev-dependencies]
branchyard-testkit = { path = "../branchyard-testkit" }
branchyard-bridge = { path = "../branchyard-bridge" }
branchyard-substrate = { path = "../branchyard-substrate", features = ["fake"] }
tempfile = { workspace = true }
