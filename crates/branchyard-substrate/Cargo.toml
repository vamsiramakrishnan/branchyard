[package]
name = "branchyard-substrate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Agent Substrate as an unqualified Branchyard sandbox provider"

# The generated ateapi code (tonic::include_proto! in src/lib.rs) uses these
# three, which cargo-machete cannot see through the include.
[package.metadata.cargo-machete]
ignored = ["prost", "prost-types", "tonic-prost"]

[features]
# An in-process fake cluster for hermetic tests: `branchyard_substrate::fake`.
fake = ["dep:tokio-stream", "tokio/net"]

[dependencies]
branchyard-bridge = { path = "../branchyard-bridge" }
branchyard-sandbox = { path = "../branchyard-sandbox" }
branchyard-workspace = { version = "0.0.1", path = "../branchyard-workspace" }
prost = { workspace = true }
prost-types = "0.14"
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
rcgen = { workspace = true }
tempfile = { workspace = true }
branchyard-substrate = { path = ".", features = ["fake"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
