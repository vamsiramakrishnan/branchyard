[package]
name = "branchyard-substrate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Agent Substrate as an unqualified Branchyard sandbox provider"

[dependencies]
branchyard-sandbox = { path = "../branchyard-sandbox" }
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
