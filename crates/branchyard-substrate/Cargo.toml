[package]
name = "branchyard-substrate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Agent Substrate as an unqualified Branchyard sandbox provider"

[features]
# An in-process fake cluster for hermetic tests: `branchyard_substrate::fake`.
fake = ["dep:tokio-stream", "tokio/net"]

[dependencies]
branchyard-bridge = { path = "../branchyard-bridge" }
branchyard-sandbox = { path = "../branchyard-sandbox" }
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
branchyard-substrate = { path = ".", features = ["fake"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
