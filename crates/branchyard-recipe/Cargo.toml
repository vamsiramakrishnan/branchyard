[package]
name = "branchyard-recipe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Environment recipes (repository scripts that create a VM) and a sandbox provider over them"

[dependencies]
branchyard-sandbox = { path = "../branchyard-sandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A recipe script's process group, stopped on a timeout. Already in Cargo.lock.
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
tempfile = "3.27.0"
