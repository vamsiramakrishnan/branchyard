[package]
name = "branchyard-recipe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Environment recipes (repository scripts that create a VM) and a sandbox provider over them"

[dependencies]
branchyard-sandbox = { path = "../branchyard-sandbox" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# A recipe script's process group, stopped on a timeout. Already in Cargo.lock.
rustix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
