[package]
name = "branchyard-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Branchyard delegation and authenticated workspace management over MCP"

[lints]
workspace = true

[[bin]]
name = "branchyard-mcp"
path = "src/main.rs"

[dependencies]
branchyard-support = { path = "../branchyard-support" }
branchyard = { path = "../branchyard" }
branchyard-client = { path = "../branchyard-client" }
clap = { workspace = true }
# The official Rust MCP SDK: only its server role and stdio transport.
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io"] }
serde_json = { workspace = true }
# rmcp is asynchronous; the server runs on one current-thread runtime.
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
branchyard-testkit = { path = "../branchyard-testkit" }
