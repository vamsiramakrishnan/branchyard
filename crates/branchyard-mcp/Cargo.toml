[package]
name = "branchyard-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Branchyard's delegation tools as a stdio MCP server, for harnesses running on a branch"

[[bin]]
name = "branchyard-mcp"
path = "src/main.rs"

[dependencies]
branchyard = { path = "../branchyard" }
clap = { version = "4.6", features = ["derive"] }
# The official Rust MCP SDK: only its server role and stdio transport.
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io"] }
serde_json = "1"
# rmcp is asynchronous; the server runs on one current-thread runtime.
tokio = { version = "1", features = ["rt", "time"] }
