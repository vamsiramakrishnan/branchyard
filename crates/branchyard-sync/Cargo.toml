[package]
name = "branchyard-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Replicates Branchyard task repositories to durable object storage: content-addressed objects, one manifest per task swapped by compare-and-swap, leases, envelope encryption and garbage collection"

[features]
# In-process stand-ins for S3, Google Cloud Storage, Azure Blob, the three
# KMS APIs and the cloud metadata servers, with the real conditional
# semantics, for hermetic tests here and in the CLI and server. See
# docs/sync.md.
testing = ["dep:httparse"]

[dependencies]
branchyard-support = { path = "../branchyard-support" }
base64 = "0.22"
blake3 = "1"
branchyard = { path = "../branchyard" }
# The blocking HTTP/1.1 client (rustls, Mozilla roots) every backend speaks
# through.
branchyard-client = { path = "../branchyard-client" }
# AES-256-GCM, ChaCha20-Poly1305, HMAC-SHA256, SHA-256, PBKDF2, HKDF and
# RSA PKCS#1 SHA-256 (service-account JWTs). Already in Cargo.lock.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httparse = { version = "1", optional = true }

[dev-dependencies]
branchyard-sync = { path = ".", features = ["testing"] }
tempfile = "3.27.0"
