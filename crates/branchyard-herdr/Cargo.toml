[package]
name = "branchyard-herdr"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A Herdr plugin that shows a Branchyard server's branches as Herdr panes"

[[bin]]
name = "branchyard-herdr"
path = "src/main.rs"

[dependencies]
branchyard = { path = "../branchyard" }
branchyard-client = { path = "../branchyard-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
# Checks plugins/herdr/herdr-plugin.toml. Already in Cargo.lock.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
