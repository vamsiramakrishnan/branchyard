[package]
name = "branchyard-herdr"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "A Herdr plugin that shows a Branchyard server's branches as Herdr panes"

[lints]
workspace = true

[[bin]]
name = "branchyard-herdr"
path = "src/main.rs"

[dependencies]
branchyard = { path = "../branchyard" }
branchyard-client = { path = "../branchyard-client" }
branchyard-support = { path = "../branchyard-support" }
clap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
branchyard-testkit = { path = "../branchyard-testkit" }
tempfile = { workspace = true }
# Checks plugins/herdr/herdr-plugin.toml. Already in Cargo.lock.
toml_edit = { workspace = true }
