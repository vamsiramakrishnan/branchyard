# Hermes Agent (0.19.0): key variables, and NAME_API_KEY= lines with a value
# in $HERMES_HOME/.env, which it loads (the name, never the value).
# Run by crates/branchyard/tests/logins.rs.

[[case]]
name = "nothing"
lines = []
cell = "unknown"
state = "unknown"
evidence = "none"
detail = "Branchyard cannot read hermes's login; a key in GOOGLE_API_KEY or OPENAI_API_KEY or ANTHROPIC_API_KEY would tell, and so would a NAME_API_KEY= line in ~/.hermes/.env; `hermes status` shows what Hermes itself sees"

[[case]]
name = "a comment, an empty key and a name that is no key configure nothing"
home = { ".hermes/.env" = "# GLM_API_KEY=fake-commented\nTERMINAL_ENV=local\nOPENROUTER_API_KEY=\n" }
lines = []
cell = "unknown"
state = "unknown"
evidence = "none"
detail = "Branchyard cannot read hermes's login; a key in GOOGLE_API_KEY or OPENAI_API_KEY or ANTHROPIC_API_KEY would tell, and so would a NAME_API_KEY= line in ~/.hermes/.env; `hermes status` shows what Hermes itself sees"

[[case]]
name = "a key line in the file it loads"
home = { ".hermes/.env" = "TERMINAL_ENV=local\nexport GLM_API_KEY=fake-glm\n" }
lines = ["fact env-file GLM_API_KEY ~/.hermes/.env"]
cell = "credentials found"
state = "logged_in"
evidence = "likely"
detail = "GLM_API_KEY is set in ~/.hermes/.env, which Hermes loads (an API key; not checked)"

[[case]]
name = "HERMES_HOME moves the file"
env = { HERMES_HOME = "{home}/hermes-home" }
home = { "hermes-home/.env" = "ZAI_API_KEY=fake-zai\n" }
lines = ["fact env-file ZAI_API_KEY ~/hermes-home/.env"]
cell = "credentials found"
state = "logged_in"
evidence = "likely"
detail = "ZAI_API_KEY is set in ~/hermes-home/.env, which Hermes loads (an API key; not checked)"

[[case]]
name = "a key variable in the environment wins"
env = { OPENAI_API_KEY = "fake-openai" }
home = { ".hermes/.env" = "GLM_API_KEY=fake-glm\n" }
lines = ["env OPENAI_API_KEY", "fact env-file GLM_API_KEY ~/.hermes/.env"]
cell = "key set (OPENAI_API_KEY)"
state = "logged_in"
evidence = "likely"
detail = "OPENAI_API_KEY is set (an API key; not checked)"
key = "OPENAI_API_KEY"
