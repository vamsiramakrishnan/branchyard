[package]
name = "branchyard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Delegate coding work to agent harnesses on git branches, and merge only validated results"

[features]
# Run harnesses in Microsandbox microVMs. Needs libcap-ng-dev to link; see
# docs/providers.md.
microsandbox = ["branchyard-microsandbox/microsandbox"]
# Keep a repository's state in PostgreSQL (Yard::open_postgres) as well as
# SQLite; see docs/durability.md.
postgres = ["dep:postgres", "dep:tokio"]
# Derive schemars::JsonSchema on the branch/delegation wire types, for
# schema/contract.json; see tools/schema-gen.
schema = ["dep:schemars", "branchyard-provision/schema", "branchyard-harness/schema"]

[dependencies]
branchyard-support = { path = "../branchyard-support" }
blake3 = "1"
branchyard-bridge = { path = "../branchyard-bridge" }
branchyard-controls = { path = "../branchyard-controls" }
branchyard-harness = { path = "../branchyard-harness" }
branchyard-microsandbox = { path = "../branchyard-microsandbox" }
branchyard-provision = { path = "../branchyard-provision" }
branchyard-runtime = { path = "../branchyard-runtime" }
branchyard-sandbox = { path = "../branchyard-sandbox" }
branchyard-recipe = { path = "../branchyard-recipe" }
branchyard-substrate = { path = "../branchyard-substrate" }
branchyard-workspace = { path = "../branchyard-workspace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }
postgres = { version = "0.19", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["rt"] }
schemars = { version = "1", optional = true }
glob = "0.3"
# Connector gateway tokens: Ed25519 (EdDSA) signatures over compact JWS,
# and their base64url encoding. Both already in Cargo.lock.
ring = "0.17"
base64 = "0.22"
# The deterministic bundle writer and reader (src/tarball.rs). Already in Cargo.lock.
tar = { version = "0.4", default-features = false }
percent-encoding = "2"
hex = "0.4"
url = "2"
# The model gateway (docs/model-gateway.md): its HTTP/1.1 parsing, TLS to
# backends with the Mozilla roots, and catalog/pricing.toml. All already
# in Cargo.lock.
httparse = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
branchyard-testkit = { path = "../branchyard-testkit" }
branchyard-support = { path = "../branchyard-support", features = ["testing"] }
branchyard-substrate = { path = "../branchyard-substrate", features = ["fake"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
