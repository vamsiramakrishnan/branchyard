[package]
name = "branchyard-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Harness driver contract and protocol drivers for Claude Code, Codex and ACP agents"

[features]
# Derive schemars::JsonSchema on wire event types, for schema/contract.json;
# see tools/schema-gen.
schema = ["dep:schemars"]

[dependencies]
agent-client-protocol-schema = { version = "1.9", default-features = false }
branchyard-controls = { path = "../branchyard-controls" }
# For `conformance::assert_conforms` and serializable events; already in the
# tree through serde_json.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", optional = true }
