[package]
name = "branchyard-controls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Selected upstream harness controls, adapted for Branchyard"

[lints]
workspace = true

[dependencies]
# The catalogs in catalog/*.toml, embedded and read at run time.
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }

[dev-dependencies]
# Tests read vendored TypeScript sources as JSON (src/tsdata.rs).
serde_json = { workspace = true }
