[package]
name = "branchyard-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Git branches, candidates, and validated integration for Branchyard"

[dependencies]
branchyard-support = { path = "../branchyard-support" }

[target."cfg(unix)".dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "process", "fs"] }

[dev-dependencies]
branchyard-testkit = { path = "../branchyard-testkit" }
