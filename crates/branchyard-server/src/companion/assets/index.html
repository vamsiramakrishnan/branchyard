<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f6f4a">
<title>Branchyard</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="artifact-preview.css">
<link rel="stylesheet" href="trajectory.css">
<link rel="stylesheet" href="changes.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="artifact-preview.js" defer></script>
<script src="trajectory.js" defer></script>
<script src="changes.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
<aside id="sidebar" class="sidebar" aria-label="Branches" hidden>
  <div class="side-top">
    <a class="brand" href="#/"><img src="icon.svg" alt="Branchyard" width="20" height="20"></a>
    <span id="repo-name" class="repo-name"></span>
    <label class="repo-pick" id="repo-pick" hidden>
      <span class="visually-hidden">Source</span>
      <select id="repo"></select>
    </label>
    <span id="live" class="live" data-state="off" role="status" aria-live="polite">offline</span>
  </div>
  <nav class="side-links" aria-label="Work">
    <a class="side-link" id="new-task" href="#/new" data-route="new"><span class="side-icon" aria-hidden="true"><svg class="icon small" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg></span>New task</a>
    <a class="side-link" href="#/attention" data-route="attention"><span class="side-icon ring" aria-hidden="true"></span>Needs you <span id="attention-count" class="count" hidden></span></a>
  </nav>
  <div class="filter" id="filter" hidden>
    <label for="branch-filter" class="visually-hidden" id="branch-filter-label">Filter branches</label>
    <div class="filter-field">
      <svg class="icon small" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zM10.6 10.6L14 14"/></svg>
      <input id="branch-filter" type="search" placeholder="Filter branches" autocomplete="off" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <p id="branch-count" class="result-count" role="status" aria-live="polite"></p>
  </div>
  <div id="branch-list" class="lanes"></div>
  <nav class="side-foot" aria-label="Sections">
    <a href="#/triggers" data-route="triggers"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1.5L3.5 9H8l-1 5.5L12.5 7H8z"/></svg>Triggers</a>
    <a href="#/queue" data-route="queue"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6"/></svg>Queue</a>
    <a href="#/settings" data-route="settings"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>Settings</a>
  </nav>
</aside>
<main id="main" tabindex="-1" aria-busy="true">
  <section class="signin" role="status">
    <h1>Connecting to Branchyard</h1>
    <p class="muted">Loading your workspace…</p>
  </section>
</main>
</div>
<div id="toasts" class="toasts" role="log" aria-live="polite" aria-label="Notifications"></div>
<dialog id="confirm" aria-labelledby="confirm-title">
  <h2 id="confirm-title">Are you sure?</h2>
  <p id="confirm-text"></p>
  <div class="row dialog-actions">
    <button type="button" id="confirm-cancel">Cancel</button>
    <button type="button" class="primary" id="confirm-ok">Confirm</button>
  </div>
</dialog>
<noscript><p>The Branchyard companion needs JavaScript.</p></noscript>
</body>
</html>
