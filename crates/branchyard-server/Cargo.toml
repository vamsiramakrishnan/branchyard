[package]
name = "branchyard-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Serves Branchyard repositories over an authenticated HTTP JSON and SSE API"

[lints]
workspace = true

[[bin]]
name = "branchyard-server"
path = "src/main.rs"

[features]
# `--database postgres://...`: branch state and operations in PostgreSQL.
postgres = ["dep:postgres", "branchyard/postgres"]
# Derive schemars::JsonSchema on the configuration file's types, and build
# schema/server.config.json from them; see tools/schema-gen and
# docs/server.md. An execution preset's `provider` is the engine's
# `Provider`, so its schema comes from the engine's.
schema = ["dep:schemars", "branchyard/schema"]

[dependencies]
branchyard-support = { path = "../branchyard-support" }
google-cloud-auth = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
branchyard = { path = "../branchyard" }
branchyard-client = { path = "../branchyard-client" }
# Execution presets read a harness profile's protocol and ask its
# provisioner whether it takes an effort, as branchyard-setup does.
branchyard-harness = { version = "0.3.0", path = "../branchyard-harness" }
branchyard-provision = { version = "0.3.0", path = "../branchyard-provision" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = { workspace = true }
hmac = "0.13"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server", "server-graceful"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rusqlite = { workspace = true }
postgres = { workspace = true, optional = true }
# OTLP's protobuf messages for trace export (docs/observability.md); already
# in the workspace through the Substrate provider.
prost = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros", "io-util", "process"] }
tempfile = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["limit", "util"] }
# The command line, also `by serve` and `by worker`.
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { version = "0.6.11", features = ["trace", "tracing"] }
schemars = { workspace = true, optional = true }
backon = { workspace = true, features = ["tokio-sleep"] }
branchyard-setup = { version = "0.3.0", path = "../branchyard-setup" }
# `sync`: served repositories replicated to durable storage (docs/sync.md).
branchyard-sync = { path = "../branchyard-sync" }
# Cron schedules in a time zone (docs/triggers.md). Already in Cargo.lock.
jiff = { workspace = true, features = ["default"] }
# The web companion's pairing secrets, VAPID signing and Web Push
# encryption (docs/companion.md); both already in Cargo.lock (ring via
# rustls).
ring = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
branchyard-bridge = { path = "../branchyard-bridge" }
branchyard-substrate = { path = "../branchyard-substrate", features = ["fake"] }
branchyard-runtime = { path = "../branchyard-runtime" }
branchyard-sandbox = { path = "../branchyard-sandbox" }
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs", "use_pem"] }
branchyard-testkit = { path = "../branchyard-testkit" }
blake3 = { workspace = true }
branchyard-sync = { path = "../branchyard-sync", features = ["testing"] }
tempfile = { workspace = true }

# Binary distribution is independent of crates.io publication.
[package.metadata.dist]
dist = true
include = ["../../LICENSE", "../../THIRD_PARTY.md", "../../packaging/licenses"]
features = ["postgres"]
