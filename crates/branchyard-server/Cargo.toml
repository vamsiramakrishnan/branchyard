[package]
name = "branchyard-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Serves Branchyard repositories over an authenticated HTTP JSON and SSE API"

[[bin]]
name = "branchyard-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
branchyard = { path = "../branchyard" }
branchyard-client = { path = "../branchyard-client" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server", "server-graceful"] }
rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["limit", "util"] }
