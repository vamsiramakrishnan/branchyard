[package]
name = "branchyard-provision"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Harness home provisioning: a sans-IO planner per harness and a small executor, derived from Scion's provisioners"

[lints]
workspace = true

[features]
# Derive schemars::JsonSchema on the provisioning wire types, for
# schema/contract.json; see tools/schema-gen.
schema = ["dep:schemars", "branchyard-harness/schema"]

[dependencies]
branchyard-support = { path = "../branchyard-support" }
branchyard-harness = { path = "../branchyard-harness" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true, optional = true }
toml_edit = { workspace = true, features = ["display"] }

[dev-dependencies]
branchyard-controls = { path = "../branchyard-controls" }
tempfile = { workspace = true }
