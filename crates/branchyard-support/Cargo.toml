[package]
name = "branchyard-support"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Named best-effort steps, poison-tolerant locks, panic-reporting threads, the one clock, ids and seedable randomness, shared by every Branchyard crate"

[features]
# `testing::capture`, a tracing subscriber that collects events, for the tests
# of crates that must show a failure was logged.
testing = []

[dependencies]
getrandom = "0.4"
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
tracing = "0.1.44"
ulid = { version = "3.0.0", default-features = false }

[target."cfg(unix)".dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
# Its own `testing` feature, for the integration tests.
branchyard-support = { path = ".", features = ["testing"] }
