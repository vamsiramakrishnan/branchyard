[package]
name = "branchyard-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Blocking Rust client for the Branchyard server API: the remote SDK"

[lints]
workspace = true

[features]
# Derive schemars::JsonSchema on every wire request/response type, and build
# schema/contract.json from them; see tools/schema-gen and docs/server.md.
schema = ["dep:schemars", "branchyard/schema"]

[dependencies]
blake3 = { workspace = true }
branchyard = { path = "../branchyard" }
branchyard-wire = { path = "../branchyard-wire" }
percent-encoding = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
webpki-roots = { workspace = true }
schemars = { workspace = true, optional = true }
uuid = { workspace = true }
backon = { workspace = true, features = ["std-blocking-sleep"] }
