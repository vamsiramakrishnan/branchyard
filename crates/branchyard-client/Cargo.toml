[package]
name = "branchyard-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Blocking Rust client for the Branchyard server API: the remote SDK"

[features]
# Derive schemars::JsonSchema on every wire request/response type, and build
# schema/contract.json from them; see tools/schema-gen and docs/server.md.
schema = ["dep:schemars", "branchyard/schema"]

[dependencies]
blake3 = "1"
branchyard = { path = "../branchyard" }
httparse = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webpki-roots = "1"
schemars = { version = "1", optional = true }
uuid = { version = "1.26.1", features = ["v4"] }
