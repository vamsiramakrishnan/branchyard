[package]
name = "branchyard-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Branchyard's setup interview: declarative questions, detected defaults and validated file plans, with no I/O"

[lints]
workspace = true

[dependencies]
branchyard-config = { version = "0.1.1", path = "../branchyard-config" }
branchyard-harness = { version = "0.1.1", path = "../branchyard-harness" }
branchyard-provision = { version = "0.1.1", path = "../branchyard-provision" }
hex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
shlex = { workspace = true }
similar = "3.2.0"
toml = { workspace = true }
toml_edit = { workspace = true, features = ["display"] }
