[package]
name = "branchyard-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Runs a harness driver against a harness process, locally or through a sandbox provider"

[dependencies]
branchyard-harness = { path = "../branchyard-harness" }
branchyard-sandbox = { path = "../branchyard-sandbox" }
serde_json = "1"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "process", "thread", "net", "fs"] }
