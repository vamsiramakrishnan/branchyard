[package]
name = "branchyard-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Runs a harness driver against a harness process, locally or through a sandbox provider"

[lints]
workspace = true

[dependencies]
branchyard-support = { path = "../branchyard-support" }
branchyard-harness = { path = "../branchyard-harness" }
branchyard-sandbox = { path = "../branchyard-sandbox" }
branchyard-wire = { path = "../branchyard-wire" }
# The egress proxy's TLS interception: a certificate authority per branch
# (rcgen), termination toward the harness and re-encryption toward the
# origin (rustls with the Mozilla roots).
rcgen = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
webpki-roots = { workspace = true }

[target."cfg(unix)".dependencies]
rustix = { workspace = true, features = ["thread", "net", "fs"] }

# Landlock's three system calls, which rustix does not wrap.
[target."cfg(target_os = \"linux\")".dependencies]
libc = { workspace = true }

[dev-dependencies]
branchyard-testkit = { path = "../branchyard-testkit" }
tempfile = { workspace = true }
