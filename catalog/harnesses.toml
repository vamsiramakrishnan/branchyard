[[harness]]
id = "claude-code"
name = "Claude Code"
binaries = ["claude"]
homepage = "https://code.claude.com/docs/en/quickstart"
install = ["curl -fsSL https://claude.ai/install.sh | bash"]
login = "claude auth login"
auth_env = ["ANTHROPIC_API_KEY"]
models = ["claude-fable-5-1[1m]", "haiku", "opus[1m]", "sonnet"]
model_flag = "--model"
resume_flag = "--resume"
sources = ["emdash:claude", "orca:claude", "orca:claude-agent-teams"]

[[harness]]
id = "codex"
name = "Codex"
binaries = ["codex"]
homepage = "https://github.com/openai/codex"
install = ["npm install -g @openai/codex", "curl -fsSL https://chatgpt.com/codex/install.sh | sh", "brew install --cask codex"]
login = "codex login --device-auth"
auth_env = ["OPENAI_API_KEY"]
models = ["gpt-5.5", "gpt-5.6-luna", "gpt-5.6-sol", "gpt-5.6-terra", "gpt-6-astra", "gpt-6-luna", "gpt-6-sol"]
model_flag = "-m"
resume_flag = "resume"
sources = ["emdash:codex", "orca:codex"]

