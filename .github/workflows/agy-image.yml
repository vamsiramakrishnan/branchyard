name: Publish agy runtime image
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  agy-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch pinned agy
        run: python3 tools/fetch_agy.py --output agy
      - name: Build and check the image
        run: |
          set -eu
          docker build -f deploy/Dockerfile.agy -t branchyard-agy:release .
          docker run --rm --user 1000:1000 --entrypoint agy branchyard-agy:release --version
          docker run --rm --entrypoint by branchyard-agy:release --version
          docker run --rm --entrypoint branchyard-server branchyard-agy:release --version
          docker run --rm --entrypoint /usr/local/libexec/branchyard-bridge branchyard-agy:release --version
      - name: Publish immutable image metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          image="ghcr.io/${GITHUB_REPOSITORY,,}-agy"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag branchyard-agy:release "$image:$version"
          docker push "$image:$version"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$version")"
          mkdir -p target/distrib
          python3 - "$digest" "$version" <<'PY'
          import json, pathlib, sys
          release = json.loads(pathlib.Path("deploy/agy-release.json").read_text())
          pathlib.Path("target/distrib/runtime-images.json").write_text(json.dumps({"branchyard_version":sys.argv[2],"agy_image":sys.argv[1],"agy_version":release["version"]},indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: artifacts-runtime-images
          path: target/distrib/runtime-images.json
          if-no-files-found: error
