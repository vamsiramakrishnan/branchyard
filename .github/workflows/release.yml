name: Release
# Prebuilt `by` and `branchyard-server` for Linux (static, musl) and macOS,
# the Python SDK's wheel and sdist, the plugin and skill archives, install.sh,
# a Homebrew formula and SHA256SUMS over all of them, with build provenance
# attestations, as a draft GitHub release; and the image with harnesses
# (deploy/Dockerfile.harnesses).
#
# Only a v* tag drafts a release (or Run workflow on such a tag with `draft`
# ticked). Every other run is a dry run: it builds, packages and installs
# the same files and keeps them as the run's `release` artifact, and attests,
# drafts and pushes nothing. A pull request runs one when it changes the
# release files; Run workflow on main runs one before a tag.
# See docs/distribution.md.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - install.sh
      - packaging/**
      - sdk/python/pyproject.toml
      - tools/homebrew_formula.py
      - tools/package.py
      - tools/release_version.py
  workflow_dispatch:
    inputs:
      draft:
        description: Draft the GitHub release (on a v* tag only; any other ref is a dry run)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  FEATURES: branchyard-cli/postgres,branchyard-server/postgres
  # Stripped, x86_64 musl (measured 27 October 2026): by 60 MB, branchyard-server 41 MB.
  CARGO_PROFILE_RELEASE_STRIP: symbols
jobs:
  version:
    # The version every file is named for: Cargo.toml's, once every version
    # field agrees with it and, on a tag, the tag is v<version>. And whether
    # this run drafts the release.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      python: ${{ steps.version.outputs.python }}
      draft: ${{ steps.version.outputs.draft }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read and check the version
        id: version
        env:
          DRAFT_INPUT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          draft=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(python3 tools/release_version.py --tag "$GITHUB_REF_NAME")
            case "$GITHUB_EVENT_NAME:$DRAFT_INPUT" in
              push:*|workflow_dispatch:true) draft=true ;;
            esac
          else
            version=$(python3 tools/release_version.py)
          fi
          {
            echo "version=$version"
            echo "python=$(python3 tools/release_version.py --pep440)"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"
          echo "Branchyard $version: draft=$draft" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # musl, linked statically: ring, the bundled SQLite and BLAKE3's C
          # are compiled by musl-gcc; nothing links OpenSSL or aws-lc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          # Both macOS targets on an Apple silicon runner; Apple's clang
          # compiles the C dependencies for either architecture.
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install musl-gcc
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install the pinned toolchain with the target
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # rust-toolchain.toml's channel, named: rustup 1.28 no longer
          # installs it on the first command that needs it.
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --target "$TARGET"
      - run: cargo fetch --locked
      - name: Build
        env:
          # cc-rs looks for <arch>-linux-musl-gcc; musl-tools installs musl-gcc.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: >-
          cargo build --release --locked --offline --target ${{ matrix.target }}
          -p branchyard-cli -p branchyard-server --features "$FEATURES"
      - name: Check the binaries
        shell: bash
        run: |
          set -euo pipefail
          dir="target/$TARGET/release"
          for bin in by branchyard-server; do
            file "$dir/$bin"
            case "$TARGET" in
              # Rust links musl executables static-pie: `file` says "static-pie linked".
              *-linux-musl) file "$dir/$bin" | grep -Eq 'static(-pie|ally) linked' ;;
            esac
          done
          # Runs where the runner can execute it (not x86_64 on Apple silicon without Rosetta).
          if "$dir/by" --version >/dev/null 2>&1 || [ "$TARGET" != x86_64-apple-darwin ]; then
            test "$("$dir/by" --version)" = "by $VERSION"
          fi
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="branchyard-$VERSION-$TARGET"
          mkdir -p "dist/$name/licenses"
          cp "target/$TARGET/release/by" "target/$TARGET/release/branchyard-server" "dist/$name/"
          cp LICENSE THIRD_PARTY.md README.md "dist/$name/"
          cp vendor/orca/LICENSE "dist/$name/licenses/orca-LICENSE"
          cp vendor/emdash/LICENSE.md "dist/$name/licenses/emdash-LICENSE.md"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Install the archive with install.sh
        shell: bash
        run: |
          set -euo pipefail
          name="branchyard-$VERSION-$TARGET"
          base="$RUNNER_TEMP/release"
          mkdir -p "$base"
          cp "dist/$name.tar.gz" "$base/"
          cp "dist/$name.tar.gz.sha256" "$base/SHA256SUMS"
          BRANCHYARD_INSTALL_BASE="$base" sh install.sh --version "$VERSION" --target "$TARGET" --prefix "$RUNNER_TEMP/by"
          test -x "$RUNNER_TEMP/by/bin/by" && test -x "$RUNNER_TEMP/by/bin/branchyard-server"
          cd "$RUNNER_TEMP"
          if "$RUNNER_TEMP/by/bin/by" --version >/dev/null 2>&1 || [ "$TARGET" != x86_64-apple-darwin ]; then
            test "$("$RUNNER_TEMP/by/bin/by" --version)" = "by $VERSION"
            # The status card, outside a repository.
            "$RUNNER_TEMP/by/bin/by"
          fi
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        if: needs.version.outputs.draft == 'true'
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  python:
    # The Python SDK's sdist and wheel, and tools/package.py's plugin, skill
    # and SDK archives; the wheel is installed into a fresh venv and imported.
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PYTHON_VERSION: ${{ needs.version.outputs.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install build==1.2.2.post1
      - name: Build
        run: |
          set -euo pipefail
          python3 tools/package.py --output dist
          python3 -m build --outdir dist sdk/python
          ls -l dist
      - name: Install the wheel into a fresh venv
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-index "dist/branchyard-$PYTHON_VERSION-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -I -c 'import branchyard, branchyard_client, importlib.metadata as m; print(m.version("branchyard"))' | grep -Fx "$PYTHON_VERSION"
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        if: needs.version.outputs.draft == 'true'
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python
          path: dist/
          if-no-files-found: error

  assemble:
    # The release as a person will download it: every file in one directory,
    # SHA256SUMS over all of them, the Homebrew formula filled from it, and
    # install.sh run against the directory. A dry run ends here; its files
    # are the run's `release` artifact, and the notes are the job summary.
    needs: [version, build, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PYTHON_VERSION: ${{ needs.version.outputs.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Collect the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --dir artifacts --pattern 'binaries-*'
          gh run download "$GITHUB_RUN_ID" --dir artifacts/python --name python
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
      - name: Write SHA256SUMS and the Homebrew formula
        run: |
          set -euo pipefail
          cp install.sh dist/
          cd dist
          # Each archive is the one its build checked.
          for sums in *.sha256; do sha256sum -c "$sums"; done
          rm -- *.sha256
          # Written outside dist first: a redirect into dist can create
          # SHA256SUMS before the glob is expanded, and it would sum itself.
          sha256sum -- * | sort -k2 > ../SHA256SUMS.partial
          mv ../SHA256SUMS.partial SHA256SUMS
          python3 ../tools/homebrew_formula.py --version "$VERSION" --sums SHA256SUMS > branchyard.rb
          sha256sum branchyard.rb >> SHA256SUMS
          sort -k2 -o SHA256SUMS SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Install from the directory, as a person would
        run: |
          set -euo pipefail
          BRANCHYARD_INSTALL_BASE="$PWD/dist" sh dist/install.sh --version "$VERSION" --prefix "$RUNNER_TEMP/by"
          cd "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/by/bin/by" --version)" = "by $VERSION"
          "$RUNNER_TEMP/by/bin/by"
      - name: Write the release notes
        run: |
          set -euo pipefail
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@PYTHON_VERSION@/$PYTHON_VERSION/g" packaging/release-notes.md.in > release-notes.md
          if grep -n '@[A-Z_]*@' release-notes.md; then exit 1; fi
          { cat release-notes.md; echo; echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          overwrite: true

  draft:
    # The only job that writes to the repository, and only for a v* tag: a
    # draft release, marked a pre-release for an -alpha/-beta/-rc version,
    # for a person to read and publish.
    needs: [version, assemble]
    if: needs.version.outputs.draft == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Collect the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --dir release --name release
          cd release/dist && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release/dist/SHA256SUMS
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag $prerelease \
            --title "Branchyard $GITHUB_REF_NAME" --notes-file release/release-notes.md release/dist/*

  image:
    # The image with harnesses: built and smoke-tested on every tag and Run
    # workflow (not on a pull request: its paths leave deploy/ out); pushed
    # to GHCR only when this run drafts a release and the repository
    # variable PUBLISH_IMAGES is 'true'.
    needs: version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: docker build -f deploy/Dockerfile.harnesses -t branchyard-harnesses:ci .
      - name: Smoke test
        run: |
          test "$(docker run --rm --entrypoint by branchyard-harnesses:ci --version)" = "by $VERSION"
          docker run --rm --entrypoint claude branchyard-harnesses:ci --version
          docker run --rm --entrypoint codex branchyard-harnesses:ci --version
          docker run --rm --entrypoint sh branchyard-harnesses:ci -c 'test "$(id -u)" != 0 && command -v claude-agent-acp && command -v ssh && command -v git'
      - name: Push
        if: vars.PUBLISH_IMAGES == 'true' && needs.version.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-harnesses:$VERSION"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag branchyard-harnesses:ci "$image"
          docker push "$image"
