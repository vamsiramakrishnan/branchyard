name: Verify foundation
# One run per change: a push to main, or a pull request (every commit pushed
# to its branch). A push to a pull request's branch is not a second run.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
  # No incremental artifacts and no debug info in any build here, as the
  # coverage job had alone before: smaller caches and faster links. A failing
  # test still names its file and line (a panic's location needs no debug
  # info). nightly.yml sets the same, so the caches it reads fit its builds.
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  fast:
    # The first signal, in minutes: every Python gate (tools/check.py --fast:
    # ruff, mypy, the docs, vendor, catalog, wire, hygiene and silent-failure
    # checks and the tests of the checks themselves) and rustfmt. No compile.
    # The jobs below are the cargo gates; none repeats these.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.15.8 mypy==2.4.0
      - run: python3 tools/check.py --fast --keep-going
      - run: cargo fmt --all -- --check
  test-engine:
    # The cargo gates one serial `controls` job ran until October 2026 (about
    # 25 minutes with a warm cache, 13 of them the workspace's tests) run as
    # this job and the five after it, in parallel, and `controls` is now the
    # one check that is green only when all of them are. Each restores a
    # cache of its own: their dependency sets differ, and a key several jobs
    # share keeps whichever job saved first. tests/test_check.py holds the
    # split to what the one job ran.
    #
    # Every crate's tests but the four the next two jobs take: the engine,
    # the harness drivers, runtime, sandbox, provisioning, workspace, setup,
    # controls and the rest. `--exclude` keeps a crate added later in this
    # job; a crate tested by two jobs, or by none, fails tests/test_check.py.
    # The timeouts below are a cold cache plus the margin a hung test needs.
    #
    # The test jobs run cargo-nextest with the `ci` profile of
    # .config/nextest.toml: a process per test, every binary's tests in one
    # pool of threads (`cargo test` runs the binaries one after another), a
    # hung test killed and named after five minutes, no retries, and a JUnit
    # report uploaded with the job. nextest does not run doctests, so
    # `cargo test --doc` runs them for the same packages.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The key nightly.yml reads: this job builds most of the workspace.
          shared-key: workspace-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python tools/install_ci_tool.py cargo-nextest
      # Resolve crates from Cargo.lock once; every later cargo step runs offline.
      - run: cargo fetch --locked
      - name: Compare generated files, never rewrite them
        # The catalog, docs/compatibility.md and the setup schemas are checked
        # by the tests below (the other schemas by the schema jobs);
        # BRANCHYARD_BLESS and BY_UPDATE_SCHEMA would make those tests
        # rewrite what they compare.
        run: test -z "${BRANCHYARD_BLESS+x}" && test -z "${BY_UPDATE_SCHEMA+x}"
      - run: cargo nextest run --workspace --exclude branchyard-cli --exclude branchyard-server --exclude branchyard-client --exclude branchyard-herdr --locked --offline --profile ci
      - run: cargo test --doc --workspace --exclude branchyard-cli --exclude branchyard-server --exclude branchyard-client --exclude branchyard-herdr --locked --offline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: junit-test-engine
          path: target/nextest/ci/junit.xml
  test-cli:
    # The `by` command: its unit tests and every file of
    # crates/branchyard-cli/tests, the SDK client examples among them. The
    # crate has no library, so it has no doctests.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-cli
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python tools/install_ci_tool.py cargo-nextest
      - run: cargo fetch --locked
      - name: Compare generated files, never rewrite them
        run: test -z "${BRANCHYARD_BLESS+x}" && test -z "${BY_UPDATE_SCHEMA+x}"
      - run: cargo nextest run -p branchyard-cli --locked --offline --profile ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: junit-test-cli
          path: target/nextest/ci/junit.xml
  test-server:
    # The server, its client and the Herdr bridge: the crates that serve the
    # HTTP API or call it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-server
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python tools/install_ci_tool.py cargo-nextest
      - run: cargo fetch --locked
      - name: Compare generated files, never rewrite them
        run: test -z "${BRANCHYARD_BLESS+x}" && test -z "${BY_UPDATE_SCHEMA+x}"
      - run: cargo nextest run -p branchyard-server -p branchyard-client -p branchyard-herdr --locked --offline --profile ci
      - run: cargo test --doc -p branchyard-server -p branchyard-client -p branchyard-herdr --locked --offline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: junit-test-server
          path: target/nextest/ci/junit.xml
  walkthrough:
    # docs/getting-started.md run for real on the built programs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: walkthrough
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - run: cargo build --locked --offline -p branchyard-cli -p branchyard-runtime --bin by --bin fake-acp-agent
      - name: Run the getting-started guide on the built programs
        # tests/test_getting_started.py runs the guide's tested blocks and checks every `by` command the
        # guides show against the built `by --help`. It needs target/debug/by and fake-acp-agent, which
        # the step above built; with REQUIRE_BINARIES=1 it fails, not skips, without them.
        run: REQUIRE_BINARIES=1 python3 tests/test_getting_started.py
  lint:
    # Clippy over the workspace with every warning an error, and the count
    # of undocumented public items against tools/missing_docs_ratchet.json.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - name: Count undocumented public items against the ratchet
        run: python tools/check_missing_docs.py
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
  schemas:
    # Each generated schema against the types that generate it (the crate's
    # tests with its `schema` feature), and Clippy with that feature on: one
    # job per schema, each with its own cache.
    name: schema ${{ matrix.schema }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - schema: schema/contract.json
            crate: branchyard-client
            test: cargo test -p branchyard-client --locked --offline --features schema
            clippy: cargo clippy -p branchyard-client --all-targets --locked --offline --features schema -- -D warnings
          - schema: schema/server.config.json
            crate: branchyard-server
            test: cargo test -p branchyard-server --locked --offline --features schema
            clippy: cargo clippy -p branchyard-server --all-targets --locked --offline --features schema -- -D warnings
          - schema: schema/rig.json
            crate: branchyard-cli
            test: cargo test -p branchyard-cli --locked --offline --features schema rig
            clippy: cargo clippy -p branchyard-cli --all-targets --locked --offline --features schema -- -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: schema-${{ matrix.crate }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - name: Compare generated files, never rewrite them
        run: test -z "${BRANCHYARD_BLESS+x}" && test -z "${BY_UPDATE_SCHEMA+x}"
      - name: Verify ${{ matrix.schema }} is generated and fresh
        run: ${{ matrix.test }}
      - run: ${{ matrix.clippy }}
  controls:
    # Green only when every job it needs is: the one name, kept from the
    # single job these replaced, that the docs and any branch rule can name
    # for the cargo gates. `!cancelled()` runs it after a needed job failed,
    # so that it fails too; skipped instead, it would count as passed for a
    # required check.
    if: ${{ !cancelled() }}
    needs: [test-engine, test-cli, test-server, walkthrough, lint, schemas]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every cargo gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            test "$result" = success || exit 1
          done
  postgres:
    # The PostgreSQL store: the shared backend conformance suite, the engine
    # and the server against a real database. The test jobs above stay
    # offline and without the feature. One build per partition; nextest
    # deals the tests out round-robin (`slice`), so the partitions take about
    # as long as each other, and each has a database of its own. The
    # doctests run once, in the first.
    name: postgres ${{ matrix.partition }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BY_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      FEATURES: branchyard/postgres,branchyard-server/postgres,branchyard-cli/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The partitions build the same thing, so they share a key.
          shared-key: postgres
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 tools/install_ci_tool.py cargo-nextest
      - run: cargo fetch --locked
      - run: cargo nextest run -p branchyard -p branchyard-server -p branchyard-cli --locked --offline --features "$FEATURES" --profile ci --partition "slice:${{ matrix.partition }}/3"
      - if: matrix.partition == 1
        run: cargo test --doc -p branchyard -p branchyard-server -p branchyard-cli --locked --offline --features "$FEATURES"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: junit-postgres-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
  postgres-lint:
    # Clippy with the PostgreSQL features, every warning an error: the step
    # the postgres job ran before its tests, now beside them.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FEATURES: branchyard/postgres,branchyard-server/postgres,branchyard-cli/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: postgres-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - run: cargo clippy --workspace --all-targets --locked --offline --features "$FEATURES" -- -D warnings
  microsandbox:
    # The Microsandbox provider with its SDK compiled in: built, linted and
    # unit-tested on every change. Its KVM tests stay ignored (no /dev/kvm on
    # hosted runners); see docs/providers.md.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: microsandbox
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev
      - run: cargo fetch --locked
      - run: cargo clippy -p branchyard-microsandbox -p branchyard -p branchyard-cli --all-targets --locked --offline --features branchyard-cli/microsandbox -- -D warnings
      - run: cargo test -p branchyard-microsandbox --locked --offline --features microsandbox
  docs:
    # Rustdoc with every warning an error: broken or private intra-doc links,
    # bad HTML in doc comments. Offline, like the build.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - run: cargo doc --workspace --no-deps --locked --offline
  all-features:
    # Every optional feature at once (postgres, microsandbox, schema, fake,
    # testing), tests and examples included. The other jobs pick features by
    # hand; this one catches a feature that stops building beside another.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: all-features
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev
      - run: cargo fetch --locked
      - run: cargo check --workspace --all-targets --all-features --locked --offline
  unused-deps:
    # A dependency no source file names. False positives (generated code) go
    # in the crate's [package.metadata.cargo-machete] with the reason.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/install_ci_tool.py cargo-machete
      - run: cargo machete
  deny:
    # The supply-chain gate (deny.toml): advisories, licenses, duplicate
    # versions, sources. It reads the advisory database from the network, so
    # it runs on its own, not in the offline build job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/install_ci_tool.py cargo-deny
      - run: cargo fetch --locked
      - run: cargo deny --locked check
  coverage-shard:
    # A third of the workspace's tests each (nextest's `slice`, dealt
    # round-robin), each shard with its own instrumented build; the first
    # also writes the unit-test report. `coverage` joins their reports and
    # holds the floors.
    name: coverage ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The shards build the same thing, so they share a key.
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rustup component add llvm-tools
      - run: python tools/install_ci_tool.py cargo-llvm-cov
      - run: python tools/install_ci_tool.py cargo-nextest
      - run: cargo fetch --locked
      - run: cargo llvm-cov nextest --workspace --locked --offline --profile ci --partition "slice:${{ matrix.shard }}/3" --lcov --output-path "lcov-${{ matrix.shard }}.info"
      - if: matrix.shard == 1
        run: cargo llvm-cov nextest -p branchyard -p branchyard-provision -p branchyard-substrate --lib --locked --offline --profile ci --lcov --output-path unit.lcov
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov-${{ matrix.shard }}
          path: |
            lcov-${{ matrix.shard }}.info
            unit.lcov
  coverage:
    # Line coverage per crate and per watched file may not fall below
    # tools/coverage_floor.json (docs/coverage.md). Two reports: the whole
    # workspace's tests, joined from the shards above, and the unit tests
    # alone for the files whose floor must not be carried by integration
    # tests. Doctests count toward neither, as before (llvm-cov runs them
    # only with `--doctests`). Runs after a shard failed (`!cancelled()`), so
    # that it fails too; skipped, it would count as passed.
    if: ${{ !cancelled() }}
    needs: [coverage-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Every shard ran its tests
        env:
          RESULT: ${{ needs.coverage-shard.result }}
        run: test "$RESULT" = success
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lcov-*
          merge-multiple: true
      - name: Join the shards' reports
        # check_coverage.py counts a line hit when any record of its file
        # hits it, so the reports join one after another. cargo llvm-cov ends
        # a report without a newline; each gets one, or its last
        # end_of_record would run into the next report's first SF: line.
        run: for report in lcov-1.info lcov-2.info lcov-3.info; do cat "$report"; echo; done > lcov.info
      - run: python tools/check_coverage.py lcov.info --unit unit.lcov
      # Even when the floor check fails: the floors are written from this artifact.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lcov
          path: |
            lcov.info
            unit.lcov
