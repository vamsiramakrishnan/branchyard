name: Verify foundation
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  controls:
    runs-on: ubuntu-latest
    # The workspace's tests, four Clippy passes and three schema builds:
    # about 15 minutes since Wave 4, so 15 cancelled runs at the edge.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/verify_vendor.py
      - run: python tests/test_verify_vendor.py
      - run: python tools/verify_derivatives.py
      - run: python tools/check_catalog.py
      - run: python tools/check_docs.py
      - run: python tools/test_scion.py --qualified
      - name: Verify the recorded upstream Claude compatibility
        run: python tools/check_scion_compatibility.py
      - run: cargo fmt --all -- --check
      # Resolve crates from Cargo.lock once; every later cargo step runs offline.
      - run: cargo fetch --locked
      - run: cargo test --workspace --locked --offline
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Verify schema/contract.json is generated and fresh
        run: cargo test -p branchyard-client --locked --offline --features schema
      - run: cargo clippy -p branchyard-client --all-targets --locked --offline --features schema -- -D warnings
      - name: Verify schema/server.config.json is generated and fresh
        run: cargo test -p branchyard-server --locked --offline --features schema
      - run: cargo clippy -p branchyard-server --all-targets --locked --offline --features schema -- -D warnings
      - name: Verify schema/rig.json is generated and fresh
        run: cargo test -p branchyard-cli --locked --offline --features schema rig
      - run: cargo clippy -p branchyard-cli --all-targets --locked --offline --features schema -- -D warnings
      - run: python tests/test_distribution.py
      - run: python tests/test_schema_validation.py
  postgres:
    # The PostgreSQL store: the shared backend conformance suite, the engine
    # and the server against a real database. The job above stays offline
    # and without the feature.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BY_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      FEATURES: branchyard/postgres,branchyard-server/postgres,branchyard-cli/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo fetch --locked
      - run: cargo clippy --workspace --all-targets --locked --offline --features "$FEATURES" -- -D warnings
      - run: cargo test -p branchyard -p branchyard-server -p branchyard-cli --locked --offline --features "$FEATURES"
  microsandbox:
    # The Microsandbox provider with its SDK compiled in: built, linted and
    # unit-tested on every change. Its KVM tests stay ignored (no /dev/kvm on
    # hosted runners); see docs/providers.md.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev
      - run: cargo fetch --locked
      - run: cargo clippy -p branchyard-microsandbox -p branchyard -p branchyard-cli --all-targets --locked --offline --features branchyard-cli/microsandbox -- -D warnings
      - run: cargo test -p branchyard-microsandbox --locked --offline --features microsandbox
