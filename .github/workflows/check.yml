name: Verify foundation
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/verify_vendor.py
      - run: python tools/verify_derivatives.py
      - run: python tools/check_catalog.py
      - run: python tools/check_docs.py
      - run: python tools/test_scion.py --qualified
      - name: Verify recorded upstream Claude incompatibility
        run: python tools/check_scion_compatibility.py
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked --offline
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
