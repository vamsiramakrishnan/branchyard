name: Verify Branchyard
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: branchyard-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/verify_vendor.py
      - run: python tools/verify_derivatives.py
      - run: python tools/check_catalog.py
      - run: python tools/check_docs.py
      - run: python tools/test_scion.py --qualified
      - name: Verify recorded upstream Claude incompatibility
        run: python tools/check_scion_compatibility.py
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked --offline
      - run: cargo build --locked --offline -p branchyard-cli
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      database:
        image: ghcr.io/pgmq/pg17-pgmq:v1.13.0
        env:
          POSTGRES_PASSWORD: branchyard-test-only
          POSTGRES_DB: branchyard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d branchyard_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BRANCHYARD_TEST_DATABASE_URL: postgres://postgres:branchyard-test-only@127.0.0.1:5432/branchyard_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo fetch --locked
      - name: Real PostgreSQL and PGMQ failure-path tests
        run: cargo test --locked --offline -p branchyard-server --test postgres -- --ignored --test-threads=1
