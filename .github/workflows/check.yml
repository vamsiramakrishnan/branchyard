name: Verify foundation
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  controls:
    runs-on: ubuntu-latest
    # The workspace's tests, four Clippy passes and three schema builds:
    # about 15 minutes since Wave 4, so 15 cancelled runs at the edge.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/verify_vendor.py
      - run: python tests/test_verify_vendor.py
      - run: python tools/verify_derivatives.py
      - run: python tools/check_catalog.py
      # No hand-rolled percent/hex/base64/shell/tar codecs (tools/handrolled_banlist.toml).
      - run: python tools/check_handrolled.py
      - run: python tests/test_check_handrolled.py
      - run: python tools/check_docs.py
      - run: python tools/check_test_hygiene.py
      - run: python tests/test_check_test_hygiene.py
      - run: python tools/check_silent_failures.py
      - run: python tests/test_check_silent_failures.py
      # The lint table's exceptions only fall, and every crate inherits the table.
      - name: Lint ratchet and workspace lint inheritance
        run: python tools/check_lint_ratchet.py
      - run: python tests/test_check_lint_ratchet.py
      - name: HTTP framing is parsed only in branchyard-wire
        run: python tools/check_wire.py
      - run: python tests/test_check_wire.py
      - name: Verify the facts in the docs are generated from the code
        run: python tools/docs_facts.py --check
      - run: python tests/test_docs_facts.py
      # Dependency versions are declared once, in [workspace.dependencies].
      - run: python tools/check_workspace_deps.py
      - run: python tests/test_check_workspace_deps.py
      - run: python tools/test_scion.py --qualified
      - name: Verify the recorded upstream Claude compatibility
        run: python tools/check_scion_compatibility.py
      - run: cargo fmt --all -- --check
      # Resolve crates from Cargo.lock once; every later cargo step runs offline.
      - run: cargo fetch --locked
      - run: cargo test --workspace --locked --offline
      - name: Verify catalog/*.toml is generated and fresh
        # BRANCHYARD_BLESS would rewrite the files instead of comparing them.
        run: test -z "${BRANCHYARD_BLESS+x}" && cargo test -p branchyard-controls --locked --offline catalog
      - name: Verify docs/compatibility.md is generated and fresh
        run: test -z "${BRANCHYARD_BLESS+x}" && cargo test -p branchyard-harness --locked --offline --test compatibility
      - name: Count undocumented public items against the ratchet
        run: python tools/check_missing_docs.py
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Verify schema/contract.json is generated and fresh
        run: cargo test -p branchyard-client --locked --offline --features schema
      - run: cargo clippy -p branchyard-client --all-targets --locked --offline --features schema -- -D warnings
      - name: Verify schema/server.config.json is generated and fresh
        run: cargo test -p branchyard-server --locked --offline --features schema
      - run: cargo clippy -p branchyard-server --all-targets --locked --offline --features schema -- -D warnings
      - name: Verify schema/rig.json is generated and fresh
        run: cargo test -p branchyard-cli --locked --offline --features schema rig
      - run: cargo clippy -p branchyard-cli --all-targets --locked --offline --features schema -- -D warnings
      - run: python tests/test_distribution.py
      - run: python tests/test_schema_validation.py
  postgres:
    # The PostgreSQL store: the shared backend conformance suite, the engine
    # and the server against a real database. The job above stays offline
    # and without the feature.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BY_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      FEATURES: branchyard/postgres,branchyard-server/postgres,branchyard-cli/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo fetch --locked
      - run: cargo clippy --workspace --all-targets --locked --offline --features "$FEATURES" -- -D warnings
      - run: cargo test -p branchyard -p branchyard-server -p branchyard-cli --locked --offline --features "$FEATURES"
  microsandbox:
    # The Microsandbox provider with its SDK compiled in: built, linted and
    # unit-tested on every change. Its KVM tests stay ignored (no /dev/kvm on
    # hosted runners); see docs/providers.md.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev
      - run: cargo fetch --locked
      - run: cargo clippy -p branchyard-microsandbox -p branchyard -p branchyard-cli --all-targets --locked --offline --features branchyard-cli/microsandbox -- -D warnings
      - run: cargo test -p branchyard-microsandbox --locked --offline --features microsandbox
  docs:
    # Rustdoc with every warning an error: broken or private intra-doc links,
    # bad HTML in doc comments. Offline, like the build.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo fetch --locked
      - run: cargo doc --workspace --no-deps --locked --offline
  all-features:
    # Every optional feature at once (postgres, microsandbox, schema, fake,
    # testing), tests and examples included. The other jobs pick features by
    # hand; this one catches a feature that stops building beside another.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev
      - run: cargo fetch --locked
      - run: cargo check --workspace --all-targets --all-features --locked --offline
  unused-deps:
    # A dependency no source file names. False positives (generated code) go
    # in the crate's [package.metadata.cargo-machete] with the reason.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/install_ci_tool.py cargo-machete
      - run: cargo machete
  deny:
    # The supply-chain gate (deny.toml): advisories, licenses, duplicate
    # versions, sources. It reads the advisory database from the network, so
    # it runs on its own, not in the offline build job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/install_ci_tool.py cargo-deny
      - run: cargo fetch --locked
      - run: cargo deny --locked check
  coverage:
    # Line coverage per crate and per watched file may not fall below
    # tools/coverage_floor.json (docs/coverage.md). Two reports: the whole
    # workspace's tests, and the unit tests alone for the files whose floor
    # must not be carried by integration tests.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: rustup component add llvm-tools
      - run: python tools/install_ci_tool.py cargo-llvm-cov
      - run: cargo fetch --locked
      - run: cargo llvm-cov --workspace --locked --offline --lcov --output-path lcov.info
      - run: cargo llvm-cov -p branchyard -p branchyard-provision -p branchyard-substrate --lib --locked --offline --lcov --output-path unit.lcov
      - run: python tools/check_coverage.py lcov.info --unit unit.lcov
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov
          path: |
            lcov.info
            unit.lcov
  python:
    # Lint, format and type-check the Python in tools/ and tests/ (ruff.toml).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.15.8 mypy==2.4.0
      - run: ruff check tools tests
      - run: ruff format --check tools tests
      - run: mypy --python-version 3.12 --ignore-missing-imports --explicit-package-bases tools tests
      - run: python tests/test_install_ci_tool.py
      - run: python tests/test_check_coverage.py
