name: Install released packages
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        # One entry per packaged target, on a runner that executes it: dist
        # builds x86_64-apple-darwin on Apple silicon, and only an Intel Mac
        # runs that binary natively. release_smoke.py refuses a runner that
        # would install another target's archive.
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            runtime: false
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            runtime: false
          - runner: macos-15
            target: aarch64-apple-darwin
            runtime: false
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            runtime: false
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            runtime: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            runtime: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcap-ng0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Install and exercise the packaged CLI
        env:
          RUNTIME: ${{ matrix.runtime }}
          TARGET: ${{ matrix.target }}
        run: python3 tools/release_smoke.py --artifacts artifacts --runtime "$RUNTIME" --target "$TARGET"
